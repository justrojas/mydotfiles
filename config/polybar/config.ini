; =============================================================================
;  polybar — floating Hyprland/Waybar-style top bar
;
;  Three things here are load-bearing and easy to get wrong:
;
;  1. TRANSPARENCY. `pseudo-transparency` is for NON-compositing WMs: it fakes
;     translucency by sampling the root pixmap. KWin composites, so there is no
;     root pixmap and polybar falls back to SOLID BLACK, logging "Failed to get
;     root pixmap" on every redraw. With a compositor, leave it off and use a
;     real ARGB background (the AA in #AARRGGBB).
;
;  2. WORKSPACES. `internal/xworkspaces` can only render a desktop's %index%,
;     %name%, or an icon chosen by NAME. It has no idea which windows live on a
;     desktop, so it cannot show contents. The pager here is therefore a script
;     module (scripts/workspaces.sh) built on wmctrl, which draws the app icons
;     present on each desktop the way Plasma's pager does.
;
;  3. GLYPHS. Nerd Font icons live in the Unicode Private Use Area. This file
;     is generated with explicit codepoints rather than pasted glyphs, because
;     pasted PUA characters get silently stripped by tooling and the failure is
;     invisible — icons simply vanish and every label renders blank.
;
;  Launch with:  ~/.config/polybar/launch.sh   (installed to ~/.local/bin/bar)
; =============================================================================

; --- Tokyo Night Storm ------------------------------------------------------
[colors]
; AARRGGBB. cc == 80% opaque; lower the AA for more see-through.
background     = #cc1a1b26
foreground     = #c0caf5
foreground-dim = #565f89
highlight      = #7aa2f7
magenta        = #bb9af7
green          = #9ece6a
yellow         = #e0af68
orange         = #ff9e64
red            = #f7768e
cyan           = #7dcfff
module-bg      = #99242938

; =============================================================================
;  BAR — floating island with rounded corners
; =============================================================================
[bar/main]
monitor        = ${env:MONITOR:}
monitor-strict = false

bottom   = false
; Detached from the screen edges on all sides — the Hyprland/Waybar idiom.
width    = 98%
height   = 34pt
offset-x = 1%
offset-y = 8pt
radius   = 12

background = ${colors.background}
foreground = ${colors.foreground}

; No border: the rounded corners plus the gap do the visual separation.
border-size   = 0
line-size     = 2pt
padding-left  = 1
padding-right = 1
module-margin = 1

; Reserve space so maximised windows do not sit underneath the bar.
override-redirect = false

font-0 = JetBrainsMono Nerd Font:style=Regular:size=10;3
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10;3
font-2 = JetBrainsMono Nerd Font Mono:style=Regular:size=13;3
font-3 = Noto Color Emoji:scale=10;3

; Workspaces hard against the left, as asked.
modules-left   = workspaces
modules-center = taskbar
modules-right  = spotify pulseaudio memory cpu temperature battery network date powermenu

separator     =
cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc    = true

; NOTE: plasmashell keeps ownership of the systray selection even with every
; panel removed, so polybar logs "Systray selection already managed" and shows
; nothing. Only enable if you have also stopped plasmashell.
; tray-position = right

; =============================================================================
;  LEFT — desktop pager showing what is ON each desktop
; =============================================================================

[module/workspaces]
type = custom/script
exec = ~/.config/polybar/scripts/workspaces.sh
interval = 1
format = <label>
label = %output%
; The script emits its own %{F}/%{B}/%{A} tags, so no padding here.
label-padding = 0

; =============================================================================
;  CENTER — windows on the current desktop
; =============================================================================

[module/taskbar]
type = custom/script
exec = ~/.config/polybar/scripts/taskbar.sh 24
interval = 1
format = <label>
label = %output%
label-padding = 0

; =============================================================================
;  RIGHT — status
; =============================================================================

[module/spotify]
type = custom/script
exec = ~/.config/polybar/scripts/spotify.sh status
interval = 1
format = <label>
format-background = ${colors.module-bg}
format-foreground = ${colors.green}
format-padding = 1
label = %output%
label-maxlen = 38
click-left   = ~/.config/polybar/scripts/spotify.sh play-pause
click-right  = ~/.config/polybar/scripts/spotify.sh next
scroll-up    = ~/.config/polybar/scripts/spotify.sh volume-up
scroll-down  = ~/.config/polybar/scripts/spotify.sh volume-down

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5

format-volume = <ramp-volume> <label-volume>
format-volume-background = ${colors.module-bg}
format-volume-foreground = ${colors.cyan}
format-volume-padding = 1
label-volume = %percentage%%

format-muted = <label-muted>
format-muted-background = ${colors.module-bg}
format-muted-foreground = ${colors.foreground-dim}
format-muted-padding = 1
label-muted = " muted"

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
click-right = pavucontrol &

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-background = ${colors.module-bg}
format-foreground = ${colors.magenta}
format-padding = 1
label = "  %gb_used%"

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-background = ${colors.module-bg}
format-foreground = ${colors.yellow}
format-padding = 1
label = "  %percentage:2%%"

[module/temperature]
type = internal/temperature
interval = 5
thermal-zone = 0
warn-temperature = 75

format = <label>
format-background = ${colors.module-bg}
format-foreground = ${colors.orange}
format-padding = 1
label = " %temperature-c%"

format-warn = <label-warn>
format-warn-background = ${colors.red}
format-warn-foreground = #1a1b26
format-warn-padding = 1
label-warn = " %temperature-c%"

[module/battery]
; Detected at runtime by launch.sh — these names vary per machine.
battery = ${env:BATTERY:BAT0}
adapter = ${env:ADAPTER:AC}
type = internal/battery
full-at = 98
low-at = 15
poll-interval = 10

format-charging = <animation-charging> <label-charging>
format-charging-background = ${colors.module-bg}
format-charging-foreground = ${colors.green}
format-charging-padding = 1
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-background = ${colors.module-bg}
format-discharging-foreground = ${colors.foreground}
format-discharging-padding = 1
label-discharging = %percentage%%

format-full = <label-full>
format-full-background = ${colors.module-bg}
format-full-foreground = ${colors.green}
format-full-padding = 1
label-full = " full"

format-low = <label-low>
format-low-background = ${colors.red}
format-low-foreground = #1a1b26
format-low-padding = 1
label-low = " %percentage%%"

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

[module/network]
; Detected at runtime by launch.sh (wireless first, then the first link up).
interface = ${env:NET_IFACE:}
type = internal/network
interface-type = wireless
interval = 5

format-connected = <label-connected>
format-connected-background = ${colors.module-bg}
format-connected-foreground = ${colors.cyan}
format-connected-padding = 1
label-connected = "  %essid%"

format-disconnected = <label-disconnected>
format-disconnected-background = ${colors.module-bg}
format-disconnected-foreground = ${colors.foreground-dim}
format-disconnected-padding = 1
label-disconnected = " off"

[module/date]
type = internal/date
interval = 10
date = "%a %d %b"
time = "%H:%M"
date-alt = "%Y-%m-%d"
time-alt = "%H:%M:%S"

format = <label>
format-background = ${colors.highlight}
format-foreground = #1a1b26
format-padding = 1
label = "  %date%  %time%"

[module/powermenu]
type = custom/text
content = "  "
content-font = 3
content-background = ${colors.red}
content-foreground = #1a1b26
click-left = qdbus org.kde.ksmserver /KSMServer logout 1 0 0 2>/dev/null &

; =============================================================================
[settings]
screenchange-reload = true
; MUST be false under a compositing WM (KWin). See note 1 at the top.
pseudo-transparency = false
