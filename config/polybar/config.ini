; =============================================================================
;  polybar — Waybar-style top bar (Tokyo Night Storm)
;
;  Why polybar and not waybar: waybar is Wayland-only (wlroots layer-shell).
;  This setup runs KDE Plasma on X11, so waybar cannot attach to the screen
;  edge. Polybar gives the same model — a declarative config file, independent
;  modules, and arbitrary script modules — on X11.
;
;  The Hyprland/waybar look comes from three things, all reproduced here:
;    1. a floating, detached bar with a margin around it (not edge-to-edge)
;    2. each module drawn as its own rounded "pill" with its own background
;    3. a flat, saturated accent palette on a dark translucent base
;
;  Launch with:  ~/.config/polybar/launch.sh   (installed to ~/.local/bin/bar)
; =============================================================================

; --- Tokyo Night Storm palette ----------------------------------------------
; Matches config/oh-my-posh/tokyonight_storm.omp.json so prompt and bar agree.
[colors]
bg          = #dd1a1b26
bg-alt      = #24283b
pill        = #292e42
fg          = #c0caf5
fg-dim      = #565f89
blue        = #7aa2f7
cyan        = #7dcfff
green       = #9ece6a
magenta     = #bb9af7
red         = #f7768e
yellow      = #e0af68
orange      = #ff9e64
teal        = #1abc9c
transparent = #00000000

; =============================================================================
;  BAR
; =============================================================================
[bar/main]
monitor         = ${env:MONITOR:}
monitor-strict  = false

; Floating bar: sit at the top, leave a margin so it reads as a detached
; island the way waybar does on a Hyprland setup.
bottom          = false
width           = 98%
height          = 30pt
offset-x        = 1%
offset-y        = 8pt
radius          = 10

background      = ${colors.bg}
foreground      = ${colors.fg}

; No global underline; each module supplies its own pill instead.
line-size       = 0pt
border-size     = 0pt
padding-left    = 1
padding-right   = 1
module-margin   = 0

; Reserve space so maximised windows don't sit under the bar.
override-redirect = false
wm-restack      = generic

; JetBrainsMono Nerd Font ships in assets/fonts and is installed by
; terminal-setup. font-N is 1-indexed in module format strings via %{T<N>}.
;
; Note these use the NON-Mono variant: a status bar is not a character grid, so
; icons should keep their natural width. font-2 is the Mono variant, reserved
; for the glyph-only pills (launcher, power) where single-cell width looks
; better. Trailing ";N" is the vertical pixel offset.
font-0 = JetBrainsMono Nerd Font:style=Bold:size=10;3
font-1 = JetBrainsMono Nerd Font:style=Regular:size=10;3
font-2 = JetBrainsMono Nerd Font Mono:style=Regular:size=13;4
font-3 = Noto Color Emoji:scale=10;3

modules-left   = launcher sep workspaces
modules-center = spotify-prev spotify spotify-next
modules-right  = pulseaudio sep memory cpu temperature sep battery sep network sep date sep powermenu

separator =
cursor-click  = pointer
cursor-scroll = ns-resize

enable-ipc = true

tray-position  = right
tray-padding   = 6
tray-maxsize   = 18
tray-background = ${colors.bg}

; =============================================================================
;  SHARED PILL STYLING
;  Polybar has no "style" inheritance for modules, so each module below sets
;  format-background / format-padding itself. Keep these values in sync.
; =============================================================================

[module/sep]
type = custom/text
content = " "
content-background = ${colors.transparent}

; =============================================================================
;  LEFT
; =============================================================================

[module/launcher]
type = custom/text
content = "  "
content-font = 2
content-foreground = ${colors.blue}
content-background = ${colors.pill}
content-padding = 1
; KDE's own launcher; falls back to rofi if you install it.
click-left  = qdbus org.kde.plasmashell /PlasmaShell activateLauncherMenu 2>/dev/null || rofi -show drun &

[module/workspaces]
; KDE virtual desktops via xworkspaces (EWMH). Works on Plasma/X11.
type = internal/xworkspaces

pin-workspaces = false
enable-click   = true
enable-scroll  = true

label-active            = %name%
label-active-background = ${colors.blue}
label-active-foreground = ${colors.bg-alt}
label-active-padding    = 1

label-occupied            = %name%
label-occupied-background = ${colors.pill}
label-occupied-foreground = ${colors.fg}
label-occupied-padding    = 1

label-urgent            = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.bg-alt}
label-urgent-padding    = 1

label-empty            = %name%
label-empty-background = ${colors.pill}
label-empty-foreground = ${colors.fg-dim}
label-empty-padding    = 1

label-active-margin   = 0
label-occupied-margin = 0
label-empty-margin    = 0

; =============================================================================
;  CENTER — Spotify (playerctl / MPRIS)
;
;  These call scripts/utilities/polybar/spotify.sh, which talks to whatever
;  MPRIS player is actually running. No OAuth, no network round-trip.
; =============================================================================

[module/spotify]
type = custom/script
exec = ~/.config/polybar/scripts/spotify.sh status
interval = 1
format = <label>
format-background = ${colors.pill}
format-foreground = ${colors.green}
format-padding = 1
label = %output%
label-maxlen = 55
; left  = play/pause, right = open the player, scroll = volume
click-left   = ~/.config/polybar/scripts/spotify.sh play-pause
click-right  = ~/.config/polybar/scripts/spotify.sh focus
scroll-up    = ~/.config/polybar/scripts/spotify.sh volume-up
scroll-down  = ~/.config/polybar/scripts/spotify.sh volume-down

[module/spotify-prev]
type = custom/script
exec = ~/.config/polybar/scripts/spotify.sh prev-icon
interval = 2
format-background = ${colors.pill}
format-foreground = ${colors.fg-dim}
format-padding = 1
click-left = ~/.config/polybar/scripts/spotify.sh previous

[module/spotify-next]
type = custom/script
exec = ~/.config/polybar/scripts/spotify.sh next-icon
interval = 2
format-background = ${colors.pill}
format-foreground = ${colors.fg-dim}
format-padding = 1
click-left = ~/.config/polybar/scripts/spotify.sh next

; =============================================================================
;  RIGHT
; =============================================================================

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5

format-volume = <ramp-volume> <label-volume>
format-volume-background = ${colors.pill}
format-volume-foreground = ${colors.cyan}
format-volume-padding = 1
label-volume = %percentage%%

format-muted = <label-muted>
format-muted-background = ${colors.pill}
format-muted-foreground = ${colors.red}
format-muted-padding = 1
label-muted = "󰝟 muted"

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

click-right = pavucontrol &

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-background = ${colors.pill}
format-foreground = ${colors.magenta}
format-padding = 1
label = "  %gb_used%"

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-background = ${colors.pill}
format-foreground = ${colors.yellow}
format-padding = 1
label = "  %percentage:2%%"

[module/temperature]
type = internal/temperature
interval = 5
; Adjust if your thermal zone differs — check /sys/class/thermal/.
thermal-zone = 0
warn-temperature = 75

format = <label>
format-background = ${colors.pill}
format-foreground = ${colors.orange}
format-padding = 1
label = " %temperature-c%"

format-warn = <label-warn>
format-warn-background = ${colors.red}
format-warn-foreground = ${colors.bg-alt}
format-warn-padding = 1
label-warn = " %temperature-c%"

[module/battery]
type = internal/battery
; Detected at runtime by launch.sh and passed in via the environment, because
; these names vary per machine (BAT0/BAT1, AC/ADP1/ACAD).
battery = ${env:BATTERY:BAT0}
adapter = ${env:ADAPTER:AC}
full-at = 98
low-at = 15
poll-interval = 10

format-charging = <animation-charging> <label-charging>
format-charging-background = ${colors.pill}
format-charging-foreground = ${colors.green}
format-charging-padding = 1
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-background = ${colors.pill}
format-discharging-foreground = ${colors.fg}
format-discharging-padding = 1
label-discharging = %percentage%%

format-full = <label-full>
format-full-background = ${colors.pill}
format-full-foreground = ${colors.green}
format-full-padding = 1
label-full = " full"

format-low = <label-low>
format-low-background = ${colors.red}
format-low-foreground = ${colors.bg-alt}
format-low-padding = 1
label-low = " %percentage%%"

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

[module/network]
type = internal/network
; Detected at runtime by launch.sh (wireless first, then the first link that
; is up). interface-type is the fallback if detection found nothing.
interface = ${env:NET_IFACE:}
interface-type = wireless
interval = 5

format-connected = <label-connected>
format-connected-background = ${colors.pill}
format-connected-foreground = ${colors.teal}
format-connected-padding = 1
label-connected = "  %essid%"

format-disconnected = <label-disconnected>
format-disconnected-background = ${colors.pill}
format-disconnected-foreground = ${colors.fg-dim}
format-disconnected-padding = 1
label-disconnected = " off"

[module/date]
type = internal/date
interval = 10
date = "%a %d %b"
time = "%H:%M"
; Click the clock to toggle a longer form.
date-alt = "%Y-%m-%d"
time-alt = "%H:%M:%S"

format = <label>
format-background = ${colors.blue}
format-foreground = ${colors.bg-alt}
format-padding = 1
label = "  %date%  %time%"

[module/powermenu]
type = custom/text
content = " ⏻ "
content-background = ${colors.red}
content-foreground = ${colors.bg-alt}
content-padding = 0
click-left = qdbus org.kde.ksmserver /KSMServer logout 1 0 0 2>/dev/null &

; =============================================================================
[settings]
screenchange-reload = true
pseudo-transparency = true
format-foreground =
format-background =
