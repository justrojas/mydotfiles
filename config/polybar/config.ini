; =============================================================================
;  polybar — styled after the KDE Plasma panel (Breeze Dark)
;
;  This is deliberately NOT the floating "Waybar pill" look. It is a flat,
;  full-width, edge-docked panel: the same visual language as the Plasma panel
;  it replaces.
;
;  Two things a Plasma panel does that need explaining here:
;
;  1. TASK MANAGER. The left side lists the windows on the CURRENT virtual
;     desktop, not the desktop names. polybar has no window-list module —
;     `internal/xworkspaces` only shows desktop names/numbers and
;     `internal/xwindow` only shows the active window's title. So the task list
;     is a script module built on wmctrl: scripts/taskbar.sh.
;
;  2. TRANSPARENCY. `pseudo-transparency` is for NON-compositing WMs: it fakes
;     translucency by sampling the root pixmap. KWin composites, so there is no
;     root pixmap to sample and polybar falls back to solid black — which was
;     the original "why is this so ugly". With a compositor running, just use a
;     real ARGB background colour and leave pseudo-transparency off.
;
;  Launch with:  ~/.config/polybar/launch.sh   (installed to ~/.local/bin/bar)
; =============================================================================

; --- Breeze Dark palette ----------------------------------------------------
[colors]
; AARRGGBB. ~90% opaque, like a stock Plasma panel over a wallpaper.
background     = #e61b1e2b
foreground     = #eff0f1
foreground-dim = #7f8c8d
highlight      = #3daee9
urgent         = #da4453
warn           = #f67400
ok             = #27ae60
separator      = #3f4451
transparent    = #00000000

; =============================================================================
;  BAR
; =============================================================================
[bar/main]
monitor        = ${env:MONITOR:}
monitor-strict = false

; Edge-docked and full width, like a Plasma panel — not a floating island.
bottom       = false
width        = 100%
height       = 38pt
offset-x     = 0
offset-y     = 0
radius       = 0

background   = ${colors.background}
foreground   = ${colors.foreground}

; A single hairline along the bottom edge, the way Breeze delineates its panel.
border-bottom-size  = 1pt
border-bottom-color = ${colors.separator}

line-size     = 2pt
padding-left  = 1
padding-right = 1
module-margin = 1

; Reserve space so maximised windows do not sit underneath.
override-redirect = false
; wm-restack is EWMH-only in this polybar build; "generic" is rejected.
; Leaving it unset lets KWin manage stacking, which is what we want on Plasma.
; wm-restack      = generic

font-0 = JetBrainsMono Nerd Font:style=Regular:size=10;3
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10;3
font-2 = JetBrainsMono Nerd Font Mono:style=Regular:size=13;4
font-3 = Noto Color Emoji:scale=10;3

modules-left   = launcher desktops
modules-center = taskbar
modules-right  = spotify pulseaudio memory cpu temperature battery network date powermenu

separator =
cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc    = true

; NOTE: plasmashell keeps ownership of the systray selection even with every
; panel removed, so polybar logs "Systray selection already managed" and shows
; no icons. Enable this only if you have also stopped plasmashell.
; tray-position   = right
; tray-padding    = 6
; tray-maxsize    = 18
; tray-background = ${colors.background}

; =============================================================================
;  LEFT — launcher + desktop pager
; =============================================================================

[module/launcher]
type = custom/text
content = "  "
content-font = 2
content-foreground = ${colors.highlight}
content-padding = 1
click-left = qdbus org.kde.plasmashell /PlasmaShell activateLauncherMenu 2>/dev/null || rofi -show drun &

[module/desktops]
; A compact pager, like Plasma's "Virtual Desktop Pager" widget: small markers
; rather than full names, since the task list already says what is running.
type = internal/xworkspaces

pin-workspaces = false
enable-click   = true
enable-scroll  = true

; %index% keeps it to a digit; %name% would print "Desktop 1" and eat the bar.
label-active            = %index%
label-active-foreground = ${colors.highlight}
label-active-underline  = ${colors.highlight}
label-active-padding    = 1

label-occupied            = %index%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding    = 1

label-empty            = %index%
label-empty-foreground = ${colors.foreground-dim}
label-empty-padding    = 1

label-urgent            = %index%
label-urgent-foreground = ${colors.urgent}
label-urgent-padding    = 1

; =============================================================================
;  CENTER — task manager
; =============================================================================

[module/taskbar]
; Windows on the current desktop, with the active one highlighted. Click a task
; to focus it. See scripts/taskbar.sh for why this is a script module.
type = custom/script
exec = ~/.config/polybar/scripts/taskbar.sh 22
interval = 1
format = <label>
label = %output%
; The script emits its own %{F}/%{B}/%{A} tags; polybar must honour them.
label-padding = 0

; =============================================================================
;  RIGHT — status
; =============================================================================

[module/spotify]
type = custom/script
exec = ~/.config/polybar/scripts/spotify.sh status
interval = 1
format = <label>
format-foreground = ${colors.ok}
label = %output%
label-maxlen = 40
click-left   = ~/.config/polybar/scripts/spotify.sh play-pause
click-right  = ~/.config/polybar/scripts/spotify.sh next
scroll-up    = ~/.config/polybar/scripts/spotify.sh volume-up
scroll-down  = ~/.config/polybar/scripts/spotify.sh volume-down

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
format-muted = <label-muted>
format-muted-foreground = ${colors.foreground-dim}
label-muted = "󰝟 muted"

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

click-right = pavucontrol &

[module/memory]
type = internal/memory
interval = 3
format = <label>
label = "  %gb_used%"

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = "  %percentage:2%%"

[module/temperature]
type = internal/temperature
interval = 5
thermal-zone = 0
warn-temperature = 75

format = <label>
label = " %temperature-c%"
format-warn = <label-warn>
format-warn-foreground = ${colors.warn}
label-warn = " %temperature-c%"

[module/battery]
; Detected at runtime by launch.sh — these names vary per machine.
battery = ${env:BATTERY:BAT0}
adapter = ${env:ADAPTER:AC}
type = internal/battery
full-at = 98
low-at = 15
poll-interval = 10

format-charging = <animation-charging> <label-charging>
format-charging-foreground = ${colors.ok}
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%

format-full = <label-full>
format-full-foreground = ${colors.ok}
label-full = " full"

format-low = <label-low>
format-low-foreground = ${colors.urgent}
label-low = " %percentage%%"

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

[module/network]
; Detected at runtime by launch.sh (wireless first, then the first link up).
interface = ${env:NET_IFACE:}
type = internal/network
interface-type = wireless
interval = 5

format-connected = <label-connected>
label-connected = "  %essid%"
format-disconnected = <label-disconnected>
format-disconnected-foreground = ${colors.foreground-dim}
label-disconnected = " off"

[module/date]
type = internal/date
interval = 10
date = "%a %d %b"
time = "%H:%M"
date-alt = "%Y-%m-%d"
time-alt = "%H:%M:%S"

format = <label>
format-foreground = ${colors.foreground}
label = "  %date%  %time%"

[module/powermenu]
type = custom/text
content = "  ⏻  "
content-foreground = ${colors.foreground-dim}
click-left = qdbus org.kde.ksmserver /KSMServer logout 1 0 0 2>/dev/null &

; =============================================================================
[settings]
screenchange-reload = true
; MUST be false under a compositing WM (KWin). See the note at the top.
pseudo-transparency = false
