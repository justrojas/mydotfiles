; =============================================================================
;  polybar — minimal floating bar
;
;  DESIGN INTENT: as little as possible, as quietly as possible.
;    • no filled highlight blocks — the active desktop is underlined, not boxed
;    • no per-module background tints
;    • no window list, no media title, no CPU/RAM, no launcher
;    • status is volume, temperature, battery %, wifi. Clock is centred.
;
;  Three things here are load-bearing and easy to get wrong:
;
;  1. TRANSPARENCY. `pseudo-transparency` is for NON-compositing WMs: it fakes
;     translucency by sampling the root pixmap. KWin composites, so there is no
;     root pixmap and polybar falls back to SOLID BLACK. Leave it off and use a
;     real ARGB background (the AA in #AARRGGBB).
;
;  2. WORKSPACES. `internal/xworkspaces` can only render %index%, %name%, or an
;     icon chosen by NAME. It cannot see a desktop's windows. The pager is
;     therefore a script module (scripts/workspaces.sh) built on wmctrl.
;
;  3. GLYPHS. Nerd Font icons are Private Use Area codepoints. This file is
;     GENERATED from explicit codepoints rather than pasted, because pasted PUA
;     characters get silently stripped and every icon becomes an empty string.
;
;  Launch with:  ~/.config/polybar/launch.sh   (installed to ~/.local/bin/bar)
; =============================================================================

[colors]
; AARRGGBB — the AA is alpha. cc = 80% opaque; drop toward 99/80 for more
; see-through, raise toward ee/ff for more solid.
; Purple-tinted dark base, accent matched to the active window titlebar
; (kdeglobals WM/activeBackground = 157,124,216) so focus reads consistently
; between the bar and the window decoration.
background = #cc1e1b2e
foreground = #c8c0dd
dim        = #6e6482
accent     = #9d7cd8
warn       = #f7768e

[bar/main]
monitor        = ${env:MONITOR:}
monitor-strict = false

bottom   = false
width    = 98%
height   = 38pt
offset-x = 1%
offset-y = 8pt
radius   = 12

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 0
; Underline thickness for the active desktop. %{+u} in workspaces.sh needs this
; to be non-zero or the active marker is invisible.
line-size     = 2pt
padding-left  = 3
padding-right = 3
module-margin = 2

override-redirect = false

font-0 = JetBrainsMono Nerd Font:style=Regular:size=11;3
font-1 = JetBrainsMono Nerd Font:style=Bold:size=11;3
font-2 = JetBrainsMono Nerd Font Mono:style=Regular:size=13;3

modules-left   = workspaces media-prev media-toggle media-next
modules-center = date
modules-right  = pulseaudio temperature battery network

separator     =
cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc    = true

; =============================================================================
;  LEFT — desktops, showing what is on them
; =============================================================================

[module/workspaces]
type = custom/script
; --watch blocks on X property changes and emits immediately; `tail = true`
; makes polybar consume that stream. Redraw latency ~2ms instead of up to 1s.
exec = ~/.config/polybar/scripts/workspaces.sh --watch
tail = true
format = <label>
label = %output%
label-padding = 0

; =============================================================================
;  CENTER — transport only. No title, no artist, no album art.
;  Each button prints nothing when no player is running, so the group collapses
;  entirely rather than sitting there as three dead glyphs.
; =============================================================================

[module/media-prev]
type = custom/script
exec = ~/.config/polybar/scripts/spotify.sh prev-icon
interval = 2
format-foreground = ${colors.dim}
click-left = ~/.config/polybar/scripts/spotify.sh previous

[module/media-toggle]
type = custom/script
exec = ~/.config/polybar/scripts/spotify.sh state-icon
interval = 1
format-foreground = ${colors.foreground}
click-left = ~/.config/polybar/scripts/spotify.sh play-pause
scroll-up   = ~/.config/polybar/scripts/spotify.sh volume-up
scroll-down = ~/.config/polybar/scripts/spotify.sh volume-down

[module/media-next]
type = custom/script
exec = ~/.config/polybar/scripts/spotify.sh next-icon
interval = 2
format-foreground = ${colors.dim}
click-left = ~/.config/polybar/scripts/spotify.sh next

; =============================================================================
;  RIGHT — battery, heat, wifi, clock. Nothing else.
; =============================================================================

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%

format-muted = <label-muted>
format-muted-foreground = ${colors.dim}
label-muted = " --"

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

click-right = pavucontrol &

[module/temperature]
type = internal/temperature
interval = 5
thermal-zone = 0
warn-temperature = 75

format = <label>
label = " %temperature-c%"
format-warn = <label-warn>
format-warn-foreground = ${colors.warn}
label-warn = " %temperature-c%"

; System monitor, for when the temperature is the interesting number.
click-left = (plasma-systemmonitor || ksysguard || kitty -e btop) >/dev/null 2>&1 &

[module/battery]
; Detected at runtime by launch.sh — these names vary per machine.
battery = ${env:BATTERY:BAT0}
adapter = ${env:ADAPTER:AC}
type = internal/battery
full-at = 98
low-at = 15
poll-interval = 10

format-charging = <label-charging>
label-charging = " %percentage%%"

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%

format-full = <label-full>
label-full = " %percentage%%"

format-low = <label-low>
format-low-foreground = ${colors.warn}
label-low = " %percentage%%"

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

; Power/battery settings.
click-left = (kcmshell5 powerdevilprofilesconfig || systemsettings5 powerdevilprofilesconfig) >/dev/null 2>&1 &

[module/network]
; Detected at runtime by launch.sh (wireless first, then the first link up).
interface = ${env:NET_IFACE:}
type = internal/network
interface-type = wireless
interval = 5

; Signal-bars glyph rather than the broad wifi-fan: same meaning, much narrower.
; The SSID is omitted — you already know which network you are on.
format-connected = <label-connected>
label-connected = "%{A1:$HOME/.config/polybar/scripts/network-menu.sh:}    %{A}"

format-disconnected = <label-disconnected>
format-disconnected-foreground = ${colors.warn}
label-disconnected = "%{A1:$HOME/.config/polybar/scripts/network-menu.sh:}    %{A}"

; Left-click opens the network manager applet. Removing the Plasma panel took
; the systray network widget with it, so without this there is no way to switch
; networks from the bar at all.
;
; This uses a %{A1:...:} action tag rather than click-left: polybar 3.5
; only honours click-* on custom/* modules, so on internal/network the
; click handler is parsed and then silently ignored.

[module/date]
type = internal/date
interval = 10
date = "%a %d %b"
time = "%H:%M"
date-alt = "%Y-%m-%d"
time-alt = "%H:%M:%S"

format = <label>
label = "%date%  %time%"
label-alt = "%time%"

; Calendar.
click-left = (kalendar || korganizer) >/dev/null 2>&1 &

[settings]
screenchange-reload = true
; MUST be false under a compositing WM (KWin). See note 1 at the top.
pseudo-transparency = false
